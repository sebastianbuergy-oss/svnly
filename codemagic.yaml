definitions:
  environment: &common_environment
    flutter: stable
    xcode: latest
    cocoapods: default
    vars:
      BUNDLE_ID: ch.sebastianbuergy.svnly
      APP_STORE_APPLE_ID: 6804053042
      APP_ENV: production
      LEGAL_BASE_URL: https://svnly.sebastian-buergy.chatgpt.site
    groups:
      - svnly_production
  production_config_gate: &production_config_gate
    name: Validate public Supabase production configuration
    script: |
      set -euo pipefail
      missing=()
      for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
        if [ -z "${!name:-}" ]; then
          missing+=("$name")
        fi
      done
      if [ "${#missing[@]}" -gt 0 ]; then
        echo "Production build blocked: missing ${missing[*]}"
        exit 1
      fi
      if [[ "$SUPABASE_URL" != https://* ]] || [[ "$SUPABASE_URL" == *YOUR_PROJECT* ]]; then
        echo "Production build blocked: SUPABASE_URL is not a valid HTTPS production URL."
        exit 1
      fi
      if [[ "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
        echo "Production build blocked: SUPABASE_PUBLISHABLE_KEY must be a Supabase publishable key."
        exit 1
      fi
      echo "Public Supabase production configuration is present."
  release_identity_gate: &release_identity_gate
    name: Verify main commit and auth release contract
    script: |
      set -euo pipefail
      HEAD_SHA="$(git rev-parse HEAD)"
      if [ "$CM_BRANCH" != "main" ]; then
        echo "Device build blocked: expected main, got $CM_BRANCH."
        exit 1
      fi
      if [ "$HEAD_SHA" != "$CM_COMMIT" ]; then
        echo "Device build blocked: checkout $HEAD_SHA differs from Codemagic commit $CM_COMMIT."
        exit 1
      fi
      grep -q 'PRODUCT_BUNDLE_IDENTIFIER = ch.sebastianbuergy.svnly;' ios/Runner.xcodeproj/project.pbxproj
      /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' ios/Runner/RunnerRelease.entitlements \
        | grep -qx 'Default'
      grep -q "generateRawNonce()" lib/features/auth/supabase_repository.dart
      grep -q "nonce: hashedNonce" lib/features/auth/supabase_repository.dart
      grep -q "provider: OAuthProvider.apple" lib/features/auth/supabase_repository.dart
      grep -q "nonce: rawNonce" lib/features/auth/supabase_repository.dart
      grep -q "auth_google" lib/features/auth/auth_screen.dart
      mkdir -p build
      printf 'commit=%s\nbuild=%s\nbranch=%s\nbundle_id=%s\n' \
        "$HEAD_SHA" "$BUILD_NUMBER" "$CM_BRANCH" "$BUNDLE_ID" \
        > build/release-identity.txt
      cat build/release-identity.txt
  checks: &quality_checks
    - name: Resolve Flutter dependencies
      script: flutter pub get
    - name: Verify deterministic challenge corpus
      script: |
        dart run tool/generate_challenges.dart
        git diff --exit-code -- assets/data/challenges.json supabase/seed.sql
    - name: Formatting gate
      script: dart format --output=none --set-exit-if-changed lib test integration_test tool
    - name: Static analysis gate
      script: flutter analyze lib test tool
    - name: Unit and widget tests
      script: mkdir -p build/test-results && flutter test --machine > build/test-results/flutter.json
      test_report: build/test-results/flutter.json
    - name: Release automation tests
      script: node --test tool/test/*.test.mjs
    - name: Dependency inventory and outdated audit
      script: |
        flutter pub deps --style=compact > build/dependencies.txt
        flutter pub outdated --no-dev-dependencies
    - name: Secret scan
      script: |
        if git grep -nEI '(sb_secret_[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----$|sk_live_[A-Za-z0-9]|AKIA[0-9A-Z]{16})' -- ':!codemagic.yaml' ':!.env.example'; then
          echo "Potential secret detected"
          exit 1
        fi
    - name: SQL and RLS contract checks
      script: |
        set -euo pipefail
        dart run tool/verify_backend_contract.dart
        cd "$CM_BUILD_DIR/services/rls-test"
        # Codemagic's builder home can contain a package.json that makes
        # Corepack force Yarn. Do not let that parent project determine
        # this isolated test workspace's package manager.
        corepack disable || true
        npm install --global pnpm@9
        echo "Node: $(node --version)"
        echo "npm: $(npm --version)"
        echo "pnpm: $(pnpm --version)"
        echo "Working directory: $(pwd)"
        test -f pnpm-lock.yaml
        pnpm install --frozen-lockfile
        pnpm test

workflows:
  svnly-ios-device:
    name: SVNLY direct iPhone Ad Hoc build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      <<: *common_environment
      ios_signing:
        provisioning_profiles:
          - profile: gosafehome-app-store-profile
            environment_variable: SVNLY_BOOTSTRAP_PROFILE_PATH
        certificates:
          - certificate: gosafehome-distribution
            environment_variable: SVNLY_DISTRIBUTION_CERTIFICATE_PATH
    scripts:
      - *production_config_gate
      - *release_identity_gate
      - name: Resolve Flutter and CocoaPods dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Prove auth UI, diagnostics and native Apple contract
        script: |
          flutter analyze lib/features/auth lib/core/errors lib/core/config/build_identity.dart
          flutter test test/error_mapper_test.dart test/app_widget_matrix_test.dart
          node --test tool/test/codemagic_production_config.test.mjs
      - name: Verify registered physical iPhone
        script: python3 tool/verify_registered_iphone.py
      - name: Enable Sign in with Apple before Ad Hoc provisioning
        script: |
          set -euo pipefail
          BUNDLE_JSON="$(
            app-store-connect bundle-ids list --json \
              --bundle-id-identifier "$BUNDLE_ID" \
              --strict-match-identifier
          )"
          BUNDLE_RESOURCE_ID="$(
            printf '%s' "$BUNDLE_JSON" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const parsed = JSON.parse(input);
                const rows = Array.isArray(parsed) ? parsed : parsed.data;
                if (!Array.isArray(rows) || rows.length !== 1 || !rows[0].id) {
                  process.exit(1);
                }
                process.stdout.write(rows[0].id);
              });
            '
          )"
          test -n "$BUNDLE_RESOURCE_ID"
          python3 tool/enable_apple_sign_in.py "$BUNDLE_RESOURCE_ID"
      - name: Fetch or create Ad Hoc signing profile
        script: |
          set -euo pipefail
          CERTIFICATE_KEY="$(mktemp)"
          trap 'rm -f "$CERTIFICATE_KEY"' EXIT
          if ! openssl pkcs12 \
            -in "$SVNLY_DISTRIBUTION_CERTIFICATE_PATH" \
            -nodes \
            -nocerts \
            -passin "pass:${CM_CERTIFICATE_PASSWORD:-}" 2>/dev/null \
            | openssl pkey -out "$CERTIFICATE_KEY" 2>/dev/null; then
            openssl pkey \
              -in "$SVNLY_DISTRIBUTION_CERTIFICATE_PATH" \
              -out "$CERTIFICATE_KEY"
          fi
          chmod 600 "$CERTIFICATE_KEY"
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --certificate-key "@file:$CERTIFICATE_KEY" \
            --create \
            --delete-stale-profiles
          rm -f -- "$SVNLY_BOOTSTRAP_PROFILE_PATH"
      - name: Configure Xcode for Ad Hoc signing
        script: xcode-project use-profiles
      - name: Build signed direct-install IPA
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=REVENUECAT_IOS_API_KEY="$REVENUECAT_IOS_API_KEY" \
            --dart-define=LEGAL_BASE_URL="$LEGAL_BASE_URL" \
            --dart-define=GIT_COMMIT_SHA="$CM_COMMIT" \
            --dart-define=APP_BUILD_NUMBER="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Verify IPA uses Ad Hoc provisioning
        script: |
          set -euo pipefail
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          PROFILE_PATH="$(find "$VERIFY_DIR/Payload" -name embedded.mobileprovision -print -quit)"
          test -n "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$VERIFY_DIR/profile.plist"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          APP_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          test "$APP_BUNDLE_ID" = "$BUNDLE_ID"
          codesign -d --entitlements :- "$APP_PATH" > "$VERIFY_DIR/app-entitlements.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.applesignin:0' "$VERIFY_DIR/app-entitlements.plist" \
            | grep -qx 'Default'
          /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$VERIFY_DIR/profile.plist" >/dev/null 2>&1 && exit 1 || true
          DEVICE_COUNT=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$VERIFY_DIR/profile.plist" | grep -c '^    ')
          test "$DEVICE_COUNT" -gt 0
          echo "Verified Ad Hoc IPA with $DEVICE_COUNT provisioned device(s)."
          echo "Verified bundle $APP_BUNDLE_ID and Sign in with Apple entitlement."
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/release-identity.txt

  svnly-testflight-internal:
    name: SVNLY internal TestFlight distribution
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Codemagic
    environment: *common_environment
    scripts:
      - name: Assign latest build and Account Holder to internal TestFlight
        script: python3 tool/configure_internal_testflight.py

  svnly-ios-simulator:
    name: SVNLY iOS simulator, native Live Looks and integration
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: ch.sebastianbuergy.svnly
        APP_ENV: ci
        LEGAL_BASE_URL: https://svnly.sebastian-buergy.chatgpt.site
    scripts:
      - name: Resolve Flutter and CocoaPods dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Flutter analysis, unit and widget tests
        script: |
          dart format --output=none --set-exit-if-changed lib test integration_test tool
          flutter analyze
          mkdir -p build/test-results
          flutter test --machine > build/test-results/flutter.json
          node --test tool/test/*.test.mjs
        test_report: build/test-results/flutter.json
      - name: Real PostgreSQL RLS matrix
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/services/rls-test"
          # Codemagic's builder home can contain a package.json that makes
          # Corepack force Yarn. Do not let that parent project determine
          # this isolated test workspace's package manager.
          corepack disable || true
          npm install --global pnpm@9
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Working directory: $(pwd)"
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile
          pnpm test
      - name: Edge Function type checks
        script: |
          brew install deno
          deno check \
            supabase/functions/register-device/index.ts \
            supabase/functions/send-apns/index.ts \
            supabase/functions/delete-take/index.ts \
            supabase/functions/moderate-take/index.ts \
            supabase/functions/scheduled-jobs/index.ts
      - name: Boot an available iPhone simulator
        script: |
          SIMULATOR_UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for runtime in d.values() for x in runtime if x['name'].startswith('iPhone')))" )
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$CM_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Build unsigned simulator app
        script: |
          flutter build ios --simulator --debug \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=LEGAL_BASE_URL="$LEGAL_BASE_URL"
      - name: Native AVFoundation Live Look proof
        script: |
          set -o pipefail
          set +e
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/ios-native-tests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO | tee build/test-results/xcodebuild.log
          XCODE_STATUS=${PIPESTATUS[0]}
          if [ "$XCODE_STATUS" -ne 0 ]; then
            RESULT_BUNDLE=$(find build/ios-native-tests/Logs/Test -name '*.xcresult' -print -quit)
            if [ -n "$RESULT_BUNDLE" ]; then
              echo "XCTest result summary"
              xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" || true
              echo "XCTest result details"
              xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE" || true
            fi
          fi
          exit "$XCODE_STATUS"
      - name: Onboarding and account integration journey
        script: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          flutter devices
          flutter test integration_test/onboarding_auth_journey_test.dart -d "$SIMULATOR_UDID"
      - name: Capture real app screenshot series from the iOS simulator
        script: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          flutter devices
          mkdir -p build/ios-simulator/screenshots
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_store_screenshots_test.dart \
            -d "$SIMULATOR_UDID"
          test "$(find build/ios-simulator/screenshots -name '*.png' | wc -l | tr -d ' ')" -eq 5
    artifacts:
      - build/ios/iphonesimulator/Runner.app/**
      - build/ios-native-tests/Logs/Test/*.xcresult
      - build/ios-simulator/screenshots/*.png
      - build/test-results/**

  svnly-tests:
    name: SVNLY quality gates
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment: *common_environment
    scripts: *quality_checks
    artifacts:
      - build/test-results/**
      - build/dependencies.txt

  svnly-ios-release:
    name: SVNLY iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      <<: *common_environment
      ios_signing:
        provisioning_profiles:
          - gosafehome-app-store-profile
        certificates:
          - certificate: gosafehome-distribution
            environment_variable: SVNLY_DISTRIBUTION_CERTIFICATE_PATH
    scripts:
      - *production_config_gate
      - name: Resolve Flutter and CocoaPods dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Verify deterministic challenge corpus
        script: |
          dart run tool/generate_challenges.dart
          git diff --exit-code -- assets/data/challenges.json supabase/seed.sql
      - name: Formatting gate
        script: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Static analysis gate
        script: flutter analyze lib test tool
      - name: Unit and widget tests
        script: mkdir -p build/test-results && flutter test --machine > build/test-results/flutter.json
        test_report: build/test-results/flutter.json
      - name: Dependency inventory and outdated audit
        script: |
          flutter pub deps --style=compact > build/dependencies.txt
          flutter pub outdated --no-dev-dependencies
      - name: Secret scan
        script: |
          if git grep -nEI '(sb_secret_[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----$|sk_live_[A-Za-z0-9]|AKIA[0-9A-Z]{16})' -- ':!codemagic.yaml' ':!.env.example'; then
            echo "Potential secret detected"
            exit 1
          fi
      - name: SQL and RLS contract checks
        script: |
          set -euo pipefail
          dart run tool/verify_backend_contract.dart
          cd "$CM_BUILD_DIR/services/rls-test"
          # Codemagic's builder home can contain a package.json that makes
          # Corepack force Yarn. Do not let that parent project determine
          # this isolated test workspace's package manager.
          corepack disable || true
          npm install --global pnpm@9
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Working directory: $(pwd)"
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile
          pnpm test
      - name: Provision and verify App Review accounts
        script: |
          required=(
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            APP_REVIEW_PRIMARY_EMAIL
            APP_REVIEW_PRIMARY_PASSWORD
            APP_REVIEW_SECONDARY_EMAIL
            APP_REVIEW_SECONDARY_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Skipping App Review account provisioning; missing variables: ${missing[*]}"
          else
            node tool/provision_review_accounts.mjs
          fi
      - name: Enable required Apple capabilities
        script: |
          set -euo pipefail
          BUNDLE_JSON="$(
            app-store-connect bundle-ids list --json \
              --bundle-id-identifier "$BUNDLE_ID" \
              --strict-match-identifier
          )"
          BUNDLE_RESOURCE_ID="$(
            printf '%s' "$BUNDLE_JSON" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const parsed = JSON.parse(input);
                const rows = Array.isArray(parsed) ? parsed : parsed.data;
                if (!Array.isArray(rows) || rows.length !== 1 || !rows[0].id) {
                  process.exit(1);
                }
                process.stdout.write(rows[0].id);
              });
            '
          )"
          test -n "$BUNDLE_RESOURCE_ID"
          app-store-connect bundle-ids enable-capabilities \
            "$BUNDLE_RESOURCE_ID" \
            --capability "Push Notifications"
          python3 tool/enable_apple_sign_in.py "$BUNDLE_RESOURCE_ID"
      - name: Configure TestFlight review information
        script: python3 tool/configure_testflight_info.py
      - name: Fetch App Store signing files
        script: |
          set -euo pipefail
          CERTIFICATE_KEY="$(mktemp)"
          trap 'rm -f "$CERTIFICATE_KEY"' EXIT
          if ! openssl pkcs12 \
            -in "$SVNLY_DISTRIBUTION_CERTIFICATE_PATH" \
            -nodes \
            -nocerts \
            -passin "pass:${CM_CERTIFICATE_PASSWORD:-}" 2>/dev/null \
            | openssl pkey -out "$CERTIFICATE_KEY" 2>/dev/null; then
            openssl pkey \
              -in "$SVNLY_DISTRIBUTION_CERTIFICATE_PATH" \
              -out "$CERTIFICATE_KEY"
          fi
          chmod 600 "$CERTIFICATE_KEY"
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$CERTIFICATE_KEY" \
            --create
      - name: Configure Xcode signing
        script: |
          xcode-project use-profiles
      - name: Set automatic App Store build number
        script: |
          LATEST_BUILD=$(
            app-store-connect get-latest-testflight-build-number \
              "$APP_STORE_APPLE_ID" \
              --all-versions
          )
          echo "SVNLY_BUILD_NUMBER=$((LATEST_BUILD + 1))" >> "$CM_ENV"
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-number="$SVNLY_BUILD_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=REVENUECAT_IOS_API_KEY="$REVENUECAT_IOS_API_KEY" \
            --dart-define=LEGAL_BASE_URL="$LEGAL_BASE_URL" \
            --dart-define=GIT_COMMIT_SHA="$CM_COMMIT" \
            --dart-define=APP_BUILD_NUMBER="$SVNLY_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/test-results/**
      - build/dependencies.txt
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: false
