definitions:
  environment: &common_environment
    flutter: stable
    xcode: latest
    cocoapods: default
    vars:
      BUNDLE_ID: ch.sebastianbuergy.svnly
      APP_ENV: production
      LEGAL_BASE_URL: https://svnly.sebastian-buergy.chatgpt.site
    groups:
      - svnly_production
  checks: &quality_checks
    - name: Resolve Flutter dependencies
      script: flutter pub get
    - name: Verify deterministic challenge corpus
      script: |
        dart run tool/generate_challenges.dart
        git diff --exit-code -- assets/data/challenges.json supabase/seed.sql
    - name: Formatting gate
      script: dart format --output=none --set-exit-if-changed lib test integration_test tool
    - name: Static analysis gate
      script: flutter analyze lib test tool
    - name: Unit and widget tests
      script: mkdir -p build/test-results && flutter test --machine > build/test-results/flutter.json
      test_report: build/test-results/flutter.json
    - name: Release automation tests
      script: node --test tool/test/*.test.mjs
    - name: Dependency inventory and outdated audit
      script: |
        flutter pub deps --style=compact > build/dependencies.txt
        flutter pub outdated --no-dev-dependencies
    - name: Secret scan
      script: |
        if git grep -nEI '(sb_secret_[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----$|sk_live_[A-Za-z0-9]|AKIA[0-9A-Z]{16})' -- ':!codemagic.yaml' ':!.env.example'; then
          echo "Potential secret detected"
          exit 1
        fi
    - name: SQL and RLS contract checks
      script: |
        set -euo pipefail
        dart run tool/verify_backend_contract.dart
        cd "$CM_BUILD_DIR/services/rls-test"
        # Codemagic's builder home can contain a package.json that makes
        # Corepack force Yarn. Do not let that parent project determine
        # this isolated test workspace's package manager.
        corepack disable || true
        npm install --global pnpm@9
        echo "Node: $(node --version)"
        echo "npm: $(npm --version)"
        echo "pnpm: $(pnpm --version)"
        echo "Working directory: $(pwd)"
        test -f pnpm-lock.yaml
        pnpm install --frozen-lockfile
        pnpm test

workflows:
  svnly-ios-simulator:
    name: SVNLY iOS simulator, native Live Looks and integration
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: ch.sebastianbuergy.svnly
        APP_ENV: ci
        LEGAL_BASE_URL: https://svnly.sebastian-buergy.chatgpt.site
    scripts:
      - name: Resolve Flutter and CocoaPods dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Flutter analysis, unit and widget tests
        script: |
          dart format --output=none --set-exit-if-changed lib test integration_test tool
          flutter analyze
          mkdir -p build/test-results
          flutter test --machine > build/test-results/flutter.json
          node --test tool/test/*.test.mjs
        test_report: build/test-results/flutter.json
      - name: Real PostgreSQL RLS matrix
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/services/rls-test"
          # Codemagic's builder home can contain a package.json that makes
          # Corepack force Yarn. Do not let that parent project determine
          # this isolated test workspace's package manager.
          corepack disable || true
          npm install --global pnpm@9
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Working directory: $(pwd)"
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile
          pnpm test
      - name: Edge Function type checks
        script: |
          brew install deno
          deno check \
            supabase/functions/register-device/index.ts \
            supabase/functions/send-apns/index.ts \
            supabase/functions/moderate-take/index.ts \
            supabase/functions/scheduled-jobs/index.ts
      - name: Boot an available iPhone simulator
        script: |
          SIMULATOR_UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for runtime in d.values() for x in runtime if x['name'].startswith('iPhone')))" )
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$CM_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Build unsigned simulator app
        script: |
          flutter build ios --simulator --debug \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=LEGAL_BASE_URL="$LEGAL_BASE_URL"
      - name: Native AVFoundation Live Look proof
        script: |
          set -o pipefail
          set +e
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/ios-native-tests \
            CODE_SIGNING_ALLOWED=NO | tee build/test-results/xcodebuild.log
          XCODE_STATUS=${PIPESTATUS[0]}
          if [ "$XCODE_STATUS" -ne 0 ]; then
            RESULT_BUNDLE=$(find build/ios-native-tests/Logs/Test -name '*.xcresult' -print -quit)
            if [ -n "$RESULT_BUNDLE" ]; then
              echo "XCTest result summary"
              xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" || true
              echo "XCTest result details"
              xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE" || true
            fi
          fi
          exit "$XCODE_STATUS"
      - name: Onboarding and account integration journey
        script: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          flutter devices
          flutter test integration_test/onboarding_auth_journey_test.dart -d "$SIMULATOR_UDID"
      - name: Capture real app screenshot series from the iOS simulator
        script: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          flutter devices
          mkdir -p build/ios-simulator/screenshots
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_store_screenshots_test.dart \
            -d "$SIMULATOR_UDID"
          test "$(find build/ios-simulator/screenshots -name '*.png' | wc -l | tr -d ' ')" -eq 5
    artifacts:
      - build/ios/iphonesimulator/Runner.app/**
      - build/ios-native-tests/Logs/Test/*.xcresult
      - build/ios-simulator/screenshots/*.png
      - build/test-results/**

  svnly-tests:
    name: SVNLY quality gates
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment: *common_environment
    scripts: *quality_checks
    artifacts:
      - build/test-results/**
      - build/dependencies.txt

  svnly-ios-release:
    name: SVNLY iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: svnly-app-store-connect
    environment:
      <<: *common_environment
    scripts:
      - name: Resolve Flutter dependencies
        script: flutter pub get
      - name: Verify deterministic challenge corpus
        script: |
          dart run tool/generate_challenges.dart
          git diff --exit-code -- assets/data/challenges.json supabase/seed.sql
      - name: Formatting gate
        script: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Static analysis gate
        script: flutter analyze lib test tool
      - name: Unit and widget tests
        script: mkdir -p build/test-results && flutter test --machine > build/test-results/flutter.json
        test_report: build/test-results/flutter.json
      - name: Dependency inventory and outdated audit
        script: |
          flutter pub deps --style=compact > build/dependencies.txt
          flutter pub outdated --no-dev-dependencies
      - name: Secret scan
        script: |
          if git grep -nEI '(sb_secret_[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----$|sk_live_[A-Za-z0-9]|AKIA[0-9A-Z]{16})' -- ':!codemagic.yaml' ':!.env.example'; then
            echo "Potential secret detected"
            exit 1
          fi
      - name: SQL and RLS contract checks
        script: |
          set -euo pipefail
          dart run tool/verify_backend_contract.dart
          cd "$CM_BUILD_DIR/services/rls-test"
          # Codemagic's builder home can contain a package.json that makes
          # Corepack force Yarn. Do not let that parent project determine
          # this isolated test workspace's package manager.
          corepack disable || true
          npm install --global pnpm@9
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Working directory: $(pwd)"
          test -f pnpm-lock.yaml
          pnpm install --frozen-lockfile
          pnpm test
      - name: Provision and verify App Review accounts
        script: node tool/provision_review_accounts.mjs
      - name: Initialize signing keychain
        script: keychain initialize
      - name: Fetch App Store signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Configure signing keychain
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Set automatic App Store build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          echo "SVNLY_BUILD_NUMBER=$((LATEST_BUILD + 1))" >> "$CM_ENV"
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-number="$SVNLY_BUILD_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=REVENUECAT_IOS_API_KEY="$REVENUECAT_IOS_API_KEY" \
            --dart-define=LEGAL_BASE_URL="$LEGAL_BASE_URL" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/test-results/**
      - build/dependencies.txt
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: false
